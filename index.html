<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パーツプレビュー</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   トークン
   ============================================================ */
:root{
  --ink:        #12192B;
  --ink-mute:   #5A6478;
  --paper:      #F3F5F8;
  --card:       #FFFFFF;
  --line:       #DCE1EA;
  --accent:     #1F5EFF;

  --font-body: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --wrap: 880px;
  --radius: 10px;

  /* 動画の縦横比。
     DMMサンプル再生プレイヤー（padding-top:75%）＝ 4 / 3
     16:9の動画なら 16 / 9、縦動画なら 9 / 16 */
  --video-ratio: 4 / 3;

  /* 動画どうしの間隔（縦 / 横） */
  --gap-row: 26px;
  --gap-col: 10px;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.9;
  letter-spacing:.01em;
}

.wrap{
  width:100%;
  max-width:var(--wrap);
  margin-inline:auto;
  padding:0 20px;
}

/* ============================================================
   HTMLソース差し込みエリア
   ============================================================ */
.stage{
  margin:40px 0 56px;
  padding:24px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
}

/* ============================================================
   動画グリッド
   3列固定。<li> を足すだけで 2段目・3段目…と折り返す
   ============================================================ */
.video-row{
  display:grid;
  grid-template-columns:repeat(3, 1fr);   /* SP・PC ともに3列固定 */
  gap:var(--gap-row) var(--gap-col);
  margin:0;
  padding:0;
  list-style:none;
}

.video-cell{
  position:relative;
  aspect-ratio:var(--video-ratio);
  overflow:hidden;
  border-radius:8px;
  background:#0C1120;
}
.video-cell > video,
.video-cell > iframe,
.video-cell > img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  object-fit:cover;
  display:block;
}

/* 各動画の下のテキスト（ソース内で編集） */
.cell-text{
  margin:8px 0 0;
  padding:9px 10px;
  background:#F7F9FC;
  border-radius:6px;
  font-size:11.5px;
  line-height:1.75;
  color:var(--ink);
}

@media (max-width:420px){
  :root{ --gap-row:20px; --gap-col:6px; }
  .cell-text{ font-size:11px; padding:7px 8px; line-height:1.7; }
  .stage{ padding:18px 14px; }
}

/* ============================================================
   フッター
   ============================================================ */
.foot{
  padding:0 0 56px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-mute);
}

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}
</style>
</head>

<body>

<main class="wrap">

  <!-- ==========================================================
       動画グリッド

       増やし方：<li> … </li> を1つコピーして下に足すだけ。
                 3つごとに自動で次の段へ折り返します。

       差し替える箇所は <li> の中の2つ：
         ・iframe の src の cid=●●●●●  … 作品ID
         ・p.cell-text の中身            … 動画下のテキスト（改行は <br>）

       ※ 元の <div style="padding-top:75%; position:relative;"> の
          ラッパーは不要です。.video-cell が同じ役割（比率の固定）を
          担っているため、iframe を直接入れれば枠にぴったり収まります。
          比率は :root の --video-ratio で一括変更できます。

       ※ プレイヤーの解像度は src の size= で変えられます。
          3列表示だと1枠が小さいため、size=560_360 など軽いサイズの方が
          読み込みが速くなります。
       ========================================================== -->
  <section class="stage">

    <!-- ================= STAGE START ================= -->
    <ul class="video-row">

      <!-- ---------- 1段目 ---------- -->

        <div class="video-cell">

        </div>

      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=snos00409/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">私の知らないエッチ、研修を受けさせてください！‘新卒’AV女優の職業初体験3本番 人生初めて尽くしで、めちゃイキまくりSpecial<br>星空ねる</p>
      </li>
      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=snos00371/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">河北彩花の素の優しさと思いやり特化<br>関東巡行 筆おろしドキュメント</p>
      </li>

      <!-- ---------- 2段目 ---------- -->
      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=ksat00102/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">4本目の説明テキスト。</p>
      </li>
      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=ksat00102/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">5本目の説明テキスト。</p>
      </li>
      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=ksat00102/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">6本目の説明テキスト。</p>
      </li>

      <!-- ---------- 3段目 ---------- -->
      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=ksat00102/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">7本目の説明テキスト。</p>
      </li>
      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=ksat00102/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">8本目の説明テキスト。</p>
      </li>
      <li>
        <div class="video-cell">
          <iframe src="https://www.dmm.co.jp/litevideo/-/part/=/cid=ksat00102/size=1280_720/"
                  scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
        <p class="cell-text">9本目の説明テキスト。</p>
      </li>

      <!-- 4段目以降は、この下に <li> を足していくだけ -->

    </ul>
    <!-- ================== STAGE END ================== -->

  </section>

</main>

<footer class="foot">
  <div class="wrap">&lt;!-- end --&gt;</div>
</footer>

</body>
</html>
